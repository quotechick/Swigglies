# nginx locations for Swigglies mounted at https://your-host.example/swigglies/ (inside your TLS server block).
# Put the zones in the http context:  limit_req_zone $binary_remote_addr zone=swigglies_api:10m rate=10r/s;
#                                     limit_req_zone $binary_remote_addr zone=swigglies_admin:1m rate=3r/s;

location = /swigglies { return 301 /swigglies/; }

# The seat key is the credential: answer OAuth discovery for the MCP door with a clean 404.
location ^~ /.well-known/oauth-protected-resource/swigglies { return 404; }
location ^~ /.well-known/oauth-authorization-server/swigglies { return 404; }

# The owner API answers only through the operator's SSH tunnel, never through the site.
location ^~ /swigglies/owner-api/ { return 404; }

# The operator's Accept page (password login; the app stores only a scrypt hash).
location = /swigglies/admin { return 301 /swigglies/admin/; }
location ^~ /swigglies/admin/ {
  limit_req zone=swigglies_admin burst=30 nodelay;
  limit_except GET HEAD POST { deny all; }
  client_max_body_size 8k;
  proxy_pass http://127.0.0.1:8162/admin/;
  proxy_http_version 1.1;
  proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Prefix /swigglies;             # scopes the session cookie to /swigglies/admin
  proxy_buffering off; proxy_read_timeout 3600s;
}

# The runner door: seat keys stage proposals and read status; nothing here executes.
location ^~ /swigglies/runner/v1/ {
  access_log off;
  limit_req zone=swigglies_api burst=20 nodelay;
  limit_except GET POST { deny all; }
  client_max_body_size 16k;
  proxy_pass http://127.0.0.1:8162/runner/v1/;
  proxy_http_version 1.1;
  proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https;
}

location ^~ /swigglies/api/ {
  limit_req zone=swigglies_api burst=40 nodelay;
  limit_except GET HEAD { deny all; }
  proxy_pass http://127.0.0.1:8162/api/;
  proxy_http_version 1.1;
  proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https;
  proxy_buffering off; proxy_read_timeout 3600s;          # server-sent events
}

location ^~ /swigglies/mcp {
  access_log off;                                          # keys ride in the URL: keep them out of logs
  limit_req zone=swigglies_api burst=40 nodelay;
  client_max_body_size 64k;
  proxy_pass http://127.0.0.1:8162/mcp;
  proxy_http_version 1.1;
  proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https;
  proxy_buffering off; proxy_read_timeout 200s;
}

location ^~ /swigglies/ {
  limit_except GET HEAD { deny all; }
  proxy_pass http://127.0.0.1:8162/;
  proxy_http_version 1.1;
  proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
